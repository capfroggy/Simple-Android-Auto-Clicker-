name: Publish Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Simple-Android-Auto-Clicker.apk
          sha256sum Simple-Android-Auto-Clicker.apk > Simple-Android-Auto-Clicker.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            Simple-Android-Auto-Clicker.apk \
            Simple-Android-Auto-Clicker.apk.sha256 \
            --title "Simple Android Auto Clicker ${GITHUB_REF_NAME}" \
            --generate-notes
